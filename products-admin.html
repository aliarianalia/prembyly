<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelola Produk | PremByLy</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; background: #f5f3ff;
      font-family: Arial, sans-serif; color: #29243a;
    }
    .container {
      max-width: 700px; margin: 20px auto; padding: 24px;
      background: white; border-radius: 16px;
    }
    h1 { font-size: 25px; }
    .top { display: flex; justify-content: space-between; gap: 10px; }
    .product {
      padding: 16px; margin-top: 14px;
      border-radius: 12px; background: #f5f3ff;
    }
    .product h3 { margin: 0 0 8px; }
    .status { font-size: 13px; color: #666; }
    button {
      border: 0; padding: 12px 16px; border-radius: 9px;
      background: #7655c9; color: white; font-weight: bold;
    }
    a { color: #7655c9; text-decoration: none; }
    #message { color: #777; }
    label {
  display: block;
  margin-top: 14px;
  margin-bottom: 6px;
}

input, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
}

textarea {
  min-height: 80px;
  font-family: Arial, sans-serif;
}
  </style>
</head>
<body>
  <main class="container">
    <div class="top">
      <h1>Kelola Produk</h1>
      <button onclick="loadProducts()">Muat ulang</button>
    </div>

    <p><a href="admin.html">← Kembali ke Dashboard</a></p>
    <p id="message">Memuat produk...</p>
    <div class="product">
  <h2>Tambah Produk Baru</h2>

  <label for="productName">Nama Produk</label>
  <input id="productName" type="text" placeholder="Contoh: Canva Pro">

  <label for="productDescription">Deskripsi</label>
  <textarea id="productDescription" placeholder="Deskripsi produk"></textarea>

  <label for="productTerms">Ketentuan</label>
  <textarea id="productTerms" placeholder="Ketentuan penggunaan"></textarea>

  <label for="productWarranty">Garansi</label>
  <textarea id="productWarranty" placeholder="Informasi garansi"></textarea>

  <label for="productImage">URL Gambar Produk</label>
  <input id="productImage" type="url" placeholder="https://...">

  <button type="button" onclick="addProduct()">Simpan Produk</button>
    </div>
    <div id="productList"></div>
  </main>

  <script>
    const SUPABASE_URL = "https://xcmfmurfuiwvqmrbpbeh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_kvU53cszj4IxkbpllaltWg_NnkRZpBu";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function loadProducts() {
      const message = document.getElementById("message");
      const list = document.getElementById("productList");

      message.textContent = "Memuat produk...";
      list.innerHTML = "";

      const { data: authData, error: authError } =
        await supabaseClient.auth.getUser();

      if (authError || !authData.user) {
        message.textContent = "Silakan login melalui halaman admin.";
        return;
      }

      const { data: admin, error: adminError } = await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", authData.user.id)
        .maybeSingle();

      if (adminError || !admin) {
        message.textContent = "Akses admin tidak ditemukan.";
        return;
      }

      const { data, error } = await supabaseClient
        .from("products")
        .select("id, name, is_active")
        .order("name");

      if (error) {
        message.textContent = "Gagal memuat produk: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        message.textContent = "Belum ada produk.";
        return;
      }

      message.textContent = "Total produk: " + data.length;

      list.innerHTML = data.map(product => `
  <div class="product">
    <h3>${escapeHTML(product.name)}</h3>
    <span class="status">
      ${product.is_active ? "Aktif" : "Nonaktif"}
    </span>
    <br><br>
    <button onclick="editProduct('${product.id}')">
      Edit Produk
    </button>
  </div>
`).join("");
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }
async function addProduct() {
  const name = document.getElementById("productName").value.trim();
  const description = document.getElementById("productDescription").value.trim();
  const terms = document.getElementById("productTerms").value.trim();
  const warranty = document.getElementById("productWarranty").value.trim();
  const image_url = document.getElementById("productImage").value.trim();

  if (!name) {
    alert("Nama produk wajib diisi.");
    return;
  }

  const { data, error } = await supabaseClient
    .from("products")
    .insert([{
      name,
      description,
      terms,
      warranty,
      image_url,
      is_active: true
    }])
    .select();

  if (error) {
    alert("Gagal menyimpan produk: " + error.message);
    return;
  }

  alert("Produk berhasil ditambahkan!");

  document.getElementById("productName").value = "";
  document.getElementById("productDescription").value = "";
  document.getElementById("productTerms").value = "";
  document.getElementById("productWarranty").value = "";
  document.getElementById("productImage").value = "";

  loadProducts();
    }
    async function editProduct(id) {
  const { data: product, error } = await supabaseClient
    .from("products")
    .select("id, name, description, terms, warranty, image_url")
    .eq("id", id)
    .single();

  if (error || !product) {
    alert("Gagal mengambil data produk.");
    return;
  }

  const name = prompt("Nama produk:", product.name);
  if (name === null) return;

  const description = prompt("Deskripsi:", product.description || "");
  if (description === null) return;

  const terms = prompt("Ketentuan:", product.terms || "");
  if (terms === null) return;

  const warranty = prompt("Garansi:", product.warranty || "");
  if (warranty === null) return;

  const image_url = prompt("URL gambar:", product.image_url || "");
  if (image_url === null) return;

  if (!name.trim()) {
    alert("Nama produk tidak boleh kosong.");
    return;
  }

  const { error: updateError } = await supabaseClient
    .from("products")
    .update({
      name: name.trim(),
      description: description.trim(),
      terms: terms.trim(),
      warranty: warranty.trim(),
      image_url: image_url.trim()
    })
    .eq("id", id);

  if (updateError) {
    alert("Gagal mengubah produk: " + updateError.message);
    return;
  }

  alert("Produk berhasil diperbarui!");
  loadProducts();
    }
    loadProducts();
  </script>
</body>
</html>
