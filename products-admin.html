<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelola Produk | PremByLy</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; background: #f5f3ff;
      font-family: Arial, sans-serif; color: #29243a;
    }
    .container {
      max-width: 700px; margin: 20px auto; padding: 24px;
      background: white; border-radius: 16px;
    }
    h1 { font-size: 25px; }
    .top { display: flex; justify-content: space-between; gap: 10px; }
    .product {
      padding: 16px; margin-top: 14px;
      border-radius: 12px; background: #f5f3ff;
    }
    .product h3 { margin: 0 0 8px; }
    .status { font-size: 13px; color: #666; }
    button {
      border: 0; padding: 12px 16px; border-radius: 9px;
      background: #7655c9; color: white; font-weight: bold;
    }
    a { color: #7655c9; text-decoration: none; }
    #message { color: #777; }
    label {
  display: block;
  margin-top: 14px;
  margin-bottom: 6px;
}

input, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
}

textarea {
  min-height: 80px;
  font-family: Arial, sans-serif;
}
  </style>
</head>
<body>
  <main class="container">
    <div class="top">
      <h1>Kelola Produk</h1>
      <button onclick="loadProducts()">Muat ulang</button>
    </div>

    <p><a href="admin.html">← Kembali ke Dashboard</a></p>
    <p id="message">Memuat produk...</p>
    <div class="product">
  <h2>Tambah Produk Baru</h2>

  <label for="productName">Nama Produk</label>
  <input id="productName" type="text" placeholder="Contoh: Canva Pro">

  <label for="productDescription">Deskripsi</label>
  <textarea id="productDescription" placeholder="Deskripsi produk"></textarea>

  <label for="productTerms">Ketentuan</label>
  <textarea id="productTerms" placeholder="Ketentuan penggunaan"></textarea>

  <label for="productWarranty">Garansi</label>
  <textarea id="productWarranty" placeholder="Informasi garansi"></textarea>

  <label for="productImage">Upload Gambar Produk</label>
<input
  id="productImage"
  type="file"
  accept="image/*"
>
      <img
  id="imagePreview"
  style="display:none; width:150px; margin-top:10px; border-radius:10px;"
  alt="Preview gambar produk"
>

  <button type="button" onclick="addProduct()">Simpan Produk</button>
    </div>
    <div id="productList"></div>
  </main>

  <script>
    const SUPABASE_URL = "https://xcmfmurfuiwvqmrbpbeh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_kvU53cszj4IxkbpllaltWg_NnkRZpBu";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function loadProducts() {
      const message = document.getElementById("message");
      const list = document.getElementById("productList");

      message.textContent = "Memuat produk...";
      list.innerHTML = "";

      const { data: authData, error: authError } =
        await supabaseClient.auth.getUser();

      if (authError || !authData.user) {
        message.textContent = "Silakan login melalui halaman admin.";
        return;
      }

      const { data: admin, error: adminError } = await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", authData.user.id)
        .maybeSingle();

      if (adminError || !admin) {
        message.textContent = "Akses admin tidak ditemukan.";
        return;
      }

      const { data, error } = await supabaseClient
        .from("products")
        .select("id, name, is_active")
        .order("name");

      if (error) {
        message.textContent = "Gagal memuat produk: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        message.textContent = "Belum ada produk.";
        return;
      }

      message.textContent = "Total produk: " + data.length;

      list.innerHTML = data.map(product => `
  <div class="product">
    <h3>${escapeHTML(product.name)}</h3>
    <span class="status">
      ${product.is_active ? "Aktif" : "Nonaktif"}
    </span>
    <br><br>
<button onclick="toggleProduct('${product.id}', ${product.is_active})">
  ${product.is_active ? "Nonaktifkan Produk" : "Aktifkan Produk"}
</button>
    <br><br>
    <button onclick="editProduct('${product.id}')">
      Edit Produk
    </button>
    <button onclick="deleteProduct('${product.id}')">
  Hapus Produk
</button>
  </div>
`).join("");
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }
async function addProduct() {
  const name = document.getElementById("productName").value.trim();
  const description = document.getElementById("productDescription").value;
  const terms = document.getElementById("productTerms").value;
  const warranty = document.getElementById("productWarranty").value;
  const imageFile = document.getElementById("productImage").files[0];

  if (!name) {
    alert("Nama produk wajib diisi!");
    return;
  }

  let imageUrl = null;

  if (imageFile) {
    if (!imageFile.type.startsWith("image/")) {
      alert("File harus berupa gambar!");
      return;
    }

    const fileName =
      Date.now() + "-" + imageFile.name.replace(/[^a-zA-Z0-9._-]/g, "_");

    const { error: uploadError } = await supabaseClient
      .storage
      .from("product_image")
      .upload(fileName, imageFile);

    if (uploadError) {
      alert("Gagal mengunggah gambar: " + uploadError.message);
      return;
    }

    const { data: publicData } = supabaseClient
      .storage
      .from("product-image")
      .getPublicUrl(fileName);

    imageUrl = publicData.publicUrl;
  }

  const { error } = await supabaseClient
    .from("products")
    .insert([{
      name,
      description,
      terms,
      warranty,
      image_url: imageUrl,
      is_active: true
    }]);

  if (error) {
    alert("Gagal menyimpan produk: " + error.message);
    return;
  }

  alert("Produk berhasil ditambahkan!");

  document.getElementById("productName").value = "";
  document.getElementById("productDescription").value = "";
  document.getElementById("productTerms").value = "";
  document.getElementById("productWarranty").value = "";
  document.getElementById("productImage").value = "";
  document.getElementById("imagePreview").style.display = "none";

  loadProducts();
                          }
    async function editProduct(id) {
  const { data: product, error: fetchError } = await supabaseClient
    .from("products")
    .select("id, name, description, terms, warranty, image_url")
    .eq("id", id)
    .single();

  if (fetchError) {
    alert("Gagal mengambil data produk: " + fetchError.message);
    return;
  }

  const name = prompt("Nama produk:", product.name);
  if (name === null) return;

  const description = prompt("Deskripsi produk:", product.description || "");
  if (description === null) return;

  const terms = prompt("Syarat dan ketentuan:", product.terms || "");
  if (terms === null) return;

  const warranty = prompt("Garansi:", product.warranty || "");
  if (warranty === null) return;

  const imageInput = document.createElement("input");
  imageInput.type = "file";
  imageInput.accept = "image/*";

  const imageFile = await new Promise(resolve => {
    imageInput.onchange = () => resolve(imageInput.files[0] || null);
    imageInput.click();
  });

  let imageUrl = product.image_url;

  if (imageFile) {
    const fileName =
      Date.now() + "-" + imageFile.name.replace(/[^a-zA-Z0-9._-]/g, "_");

    const { error: uploadError } = await supabaseClient
      .storage
      .from("product-image")
      .upload(fileName, imageFile);

    if (uploadError) {
      alert("Gagal mengunggah gambar: " + uploadError.message);
      return;
    }

    const { data: publicData } = supabaseClient
      .storage
      .from("product_image")
      .getPublicUrl(fileName);

    imageUrl = publicData.publicUrl;
  }

  const { error } = await supabaseClient
    .from("products")
    .update({
      name,
      description,
      terms,
      warranty,
      image_url: imageUrl
    })
    .eq("id", id);

  if (error) {
    alert("Gagal memperbarui produk: " + error.message);
    return;
  }

  alert("Produk berhasil diperbarui!");
  loadProducts();
            }
    async function deleteProduct(id) {
  const yakin = confirm(
    "Apakah kamu yakin ingin menghapus produk ini?"
  );

  if (!yakin) return;

  const { error } = await supabaseClient
    .from("products")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Gagal menghapus produk: " + error.message);
    return;
  }

  alert("Produk berhasil dihapus!");
  loadProducts();
    }
    async function toggleProduct(id, currentStatus) {
  const newStatus = !currentStatus;

  const { error } = await supabaseClient
    .from("products")
    .update({ is_active: newStatus })
    .eq("id", id);

  if (error) {
    alert("Gagal mengubah status produk: " + error.message);
    return;
  }

  alert(
    newStatus
      ? "Produk berhasil diaktifkan!"
      : "Produk berhasil dinonaktifkan!"
  );

  loadProducts();
    }
    document.getElementById("productImage").addEventListener("change", function(event) {
  const file = event.target.files[0];
  const preview = document.getElementById("imagePreview");

  if (!file) {
    preview.style.display = "none";
    preview.src = "";
    return;
  }

  if (!file.type.startsWith("image/")) {
    alert("Silakan pilih file gambar.");
    event.target.value = "";
    preview.style.display = "none";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
});
    loadProducts();
  </script>
</body>
</html>
