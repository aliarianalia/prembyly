<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelola Produk | PremByLy</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; background: #f5f3ff;
      font-family: Arial, sans-serif; color: #29243a;
    }
    .container {
      max-width: 700px; margin: 20px auto; padding: 24px;
      background: white; border-radius: 16px;
    }
    h1 { font-size: 25px; }
    .top { display: flex; justify-content: space-between; gap: 10px; }
    .product {
      padding: 16px; margin-top: 14px;
      border-radius: 12px; background: #f5f3ff;
    }
    .product h3 { margin: 0 0 8px; }
    .status { font-size: 13px; color: #666; }
    button {
      border: 0; padding: 12px 16px; border-radius: 9px;
      background: #7655c9; color: white; font-weight: bold;
    }
    a { color: #7655c9; text-decoration: none; }
    #message { color: #777; }
  </style>
</head>
<body>
  <main class="container">
    <div class="top">
      <h1>Kelola Produk</h1>
      <button onclick="loadProducts()">Muat ulang</button>
    </div>

    <p><a href="admin.html">← Kembali ke Dashboard</a></p>
    <p id="message">Memuat produk...</p>
    <div id="productList"></div>
  </main>

  <script>
    const SUPABASE_URL = "https://xcmfmurfuiwvqmrbpbeh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_kvU53cszj4IxkbpllaltWg_NnkRZpBu";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function loadProducts() {
      const message = document.getElementById("message");
      const list = document.getElementById("productList");

      message.textContent = "Memuat produk...";
      list.innerHTML = "";

      const { data: authData, error: authError } =
        await supabaseClient.auth.getUser();

      if (authError || !authData.user) {
        message.textContent = "Silakan login melalui halaman admin.";
        return;
      }

      const { data: admin, error: adminError } = await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", authData.user.id)
        .maybeSingle();

      if (adminError || !admin) {
        message.textContent = "Akses admin tidak ditemukan.";
        return;
      }

      const { data, error } = await supabaseClient
        .from("products")
        .select("id, name, category, is_active")
        .order("name");

      if (error) {
        message.textContent = "Gagal memuat produk: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        message.textContent = "Belum ada produk.";
        return;
      }

      message.textContent = "Total produk: " + data.length;

      list.innerHTML = data.map(product => `
        <div class="product">
          <h3>${escapeHTML(product.name)}</h3>
          <p>${escapeHTML(product.category || "Produk Digital")}</p>
          <span class="status">
            ${product.is_active ? "Aktif" : "Nonaktif"}
          </span>
        </div>
      `).join("");
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    loadProducts();
  </script>
</body>
</html>
